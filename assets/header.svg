
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Mrinmoy Deka — Curious about what's under the hood</title>
  <desc id="desc">A dark, atmospheric blue-green terminal banner with CRT scanlines, digital noise, and large readable typography.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071216"/>
      <stop offset="55%" stop-color="#0b1b21"/>
      <stop offset="100%" stop-color="#071018"/>
    </linearGradient>

    <radialGradient id="glow" cx="78%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1c777b" stop-opacity=".32"/>
      <stop offset="55%" stop-color="#123d4b" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#071216" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#79cbb5"/>
      <stop offset="100%" stop-color="#4b8fa5"/>
    </linearGradient>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#9adbd1" stroke-opacity=".055" stroke-width=".7"/>
    </pattern>

    <pattern id="digitalBits" width="100" height="60" patternUnits="userSpaceOnUse">
      <text x="10" y="18" fill="#8bbfb6" opacity=".15" font-family="monospace" font-size="11">0101</text>
      <text x="57" y="48" fill="#7aa8c0" opacity=".13" font-family="monospace" font-size="10">1010</text>
      <circle cx="85" cy="14" r="1.5" fill="#79c6b4" opacity=".25"/>
    </pattern>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="5" fill="url(#background)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <ellipse cx="950" cy="160" rx="250" ry="120"
           fill="#1a7478" opacity=".12" filter="url(#softGlow)"/>

  <!-- Abstract digital landscape -->
  <path d="M650 320 L850 178 L938 225 L1054 128 L1200 210 V320 Z"
        fill="#0b252b" opacity=".82"/>

  <path d="M760 320 L928 220 L1000 252 L1114 181 L1200 224 V320 Z"
        fill="#102e35" opacity=".76"/>

  <path d="M770 0V320 M1020 0V320"
        stroke="#8bd2c2" stroke-opacity=".07"/>

  <!-- Subtle digital texture -->
  <rect width="1200" height="320" fill="url(#digitalBits)"/>
  <rect width="1200" height="320" fill="url(#scanlines)"/>

  <!-- Terminal heading -->
  <g font-family="monospace">
    <text x="66" y="55"
          fill="#86c7b8"
          font-size="15"
          letter-spacing="2">
      MRINMOY@DEVBOX
      <tspan fill="#547d88"> ~ </tspan>
      <tspan fill="#a3cfc5">/ curiosity</tspan>
    </text>

    <path d="M66 73H300" stroke="url(#accent)" stroke-width="2" opacity=".8"/>

    <!-- Main title: intentionally large -->
    <text x="62" y="145"
          fill="#e6f0ee"
          font-size="48"
          font-weight="700"
          letter-spacing="-1.5">
      Mrinmoy Deka
    </text>

    <!-- Main tagline -->
    <text x="66" y="190"
          fill="#a5d4cb"
          font-size="22"
          font-weight="400">
      curious about what's under the hood.
    </text>

    <!-- Short identity line -->
    <text x="67" y="235"
          fill="#91b5bc"
          font-size="16"
          letter-spacing="1">
      code
      <tspan fill="#65b7a5"> · </tspan>
      systems
      <tspan fill="#65b7a5"> · </tspan>
      experiments
    </text>
  </g>

  <!-- Terminal code panel -->
  <g font-family="monospace">
    <rect x="817" y="194" width="317" height="78" rx="6"
          fill="#071619" fill-opacity=".88"
          stroke="#39776f" stroke-opacity=".75"/>

    <circle cx="836" cy="211" r="3" fill="#79cbb5"/>

    <text x="849" y="216" fill="#8bd0b8" font-size="13">
      while (curious) {
    </text>

    <text x="867" y="238" fill="#a5cbd0" font-size="13">
      keep_building();
    </text>

    <text x="849" y="258" fill="#8bd0b8" font-size="13">
      }
    </text>
  </g>

  <!-- Bottom accent -->
  <path d="M0 301H1200" stroke="url(#accent)" stroke-width="2" opacity=".65"/>
  <path d="M66 301H310" stroke="#82d2b6" stroke-width="3" opacity=".95"/>

  <!-- Border -->
  <rect x=".5" y=".5" width="1199" height="319"
        fill="none" stroke="#234149" stroke-opacity=".8"/>
</svg>
