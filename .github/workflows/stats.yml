name: Update Language Statistics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Language Stats
        uses: StefVuck/Github-Language-Stats@v1.2.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          visualization_types: "leaderboard donut" # Removed the comma
          output_path: "github-stats" # Matching your log output
